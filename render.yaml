# Este fichero no es la fuente de verdad: el servicio se creó desde Public Git Repository
# en el panel de Render y se gestiona allí. Además, aquí se declaraban variables que no
# existen en Render (FLASK_ENV, PYTHONUNBUFFERED). Se queda solo como referencia.
services:
  - type: web
    name: cosknot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
    # El dominio real ya está activo y verificado en el panel de Render, no por este
    # blueprint. Si algún día se despliega desde render.yaml, esta es la lista.
    domains:
      - cosknot.duckdns.org
      - www.cosknot.duckdns.org
