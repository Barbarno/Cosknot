# OBSOLETO desde la fase 1 de la migración a Heroku (docs/decisions/0003).
#
# El despliegue real es Heroku: Procfile + .python-version + Heroku Postgres. Este
# blueprint no se usa, no se mantiene y sus valores ya no coinciden con producción
# (plan free, dos workers, dominio de DuckDNS, sin addon de Postgres).
#
# Se conserva solo como referencia histórica hasta que se confirme el borrado.
#
# --- referencia histórica, no usar ---
services:
  - type: web
    name: cosknot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
    domains:
      - cosknot.duckdns.org
      - www.cosknot.duckdns.org
