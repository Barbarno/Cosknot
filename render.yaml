services:
  - type: web
    name: cosknot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
    # se activa despues del merge del PR en is-a.dev; si se pone antes, el
    # blueprint falla la verificacion del dominio
    # domains:
    #   - cosknot.is-a.dev
