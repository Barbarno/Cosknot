name: despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Dos pushes seguidos no deben solapar dos despliegues sobre el mismo servicio.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Render ya despliega solo con autoDeploy al hacer push; aquí no se dispara
      # nada, se localiza el deploy de ESTE commit para poder seguirlo. El POST
      # /deploys devuelve 202 sin cuerpo, así que no sirve para obtener el id.
      - name: Localizar el deploy de este commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "faltan RENDER_API_KEY o RENDER_SERVICE_ID" >&2
            exit 1
          fi
          deploy_id=""
          for i in $(seq 1 12); do
            deploy_id=$(curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=5" \
              | python3 -c "
import json, sys
sha = sys.argv[1]
for item in json.load(sys.stdin):
    deploy = item['deploy']
    commit = (deploy.get('commit') or {}).get('id') or ''
    if commit.startswith(sha):
        print(deploy['id'])
        break
" "$GITHUB_SHA")
            if [ -n "$deploy_id" ]; then
              break
            fi
            echo "no aparece todavía un deploy para $GITHUB_SHA, esperando 5 s"
            sleep 5
          done
          if [ -z "$deploy_id" ]; then
            echo "render no creó un deploy para $GITHUB_SHA" >&2
            exit 1
          fi
          echo "despliegue $deploy_id"
          echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"

      # Sondear /healthz no dice nada: en el plan free el servicio duerme y responde 200
      # con la versión anterior. Hay que mirar el estado del despliegue que acabamos de crear.
      - name: Esperar a que el despliegue quede live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            estado=$(curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            echo "intento $i/40: $estado"
            case "$estado" in
              live) exit 0 ;;
              build_failed|canceled|deactivated|pre_deploy_failed)
                echo "el despliegue terminó en $estado" >&2
                exit 1 ;;
            esac
            sleep 15
          done
          echo "el despliegue no llegó a live en 10 min" >&2
          exit 1

      # El plan free duerme a los 15 min, así que el primer /healthz puede tardar ~50 s.
      - name: Comprobar /healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://cosknot.onrender.com/healthz > /dev/null; then
              echo "sano tras el intento $i"
              exit 0
            fi
            echo "intento $i/20 sin respuesta, esperando 15 s"
            sleep 15
          done
          echo "el servicio no respondió 200 en 5 min" >&2
          exit 1
