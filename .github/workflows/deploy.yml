name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Render ya tiene autoDeploy activado sobre el repo publico; este job fuerza el deploy
      # cuando el polling de Render no lo detecta y verifica que el servicio queda sano.
      - name: Disparar deploy en Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "faltan RENDER_API_KEY o RENDER_SERVICE_ID: saltando el trigger" >&2
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" > /dev/null

      # El plan free duerme a los 15 min: el primer /healthz puede tardar ~50 s.
      - name: Esperar a que /healthz responda 200
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://cosknot.onrender.com/healthz > /dev/null; then
              echo "healthy tras intento $i"
              exit 0
            fi
            echo "intento $i/20 sin respuesta, esperando 15 s"
            sleep 15
          done
          echo "el servicio no respondio 200 en 5 min" >&2
          exit 1
