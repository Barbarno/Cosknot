name: copia de seguridad

# Copia diaria propia, fuera de Heroku: pg_dump cifrado a R2. La copia gestionada
# de Heroku (pg:backups:schedule) va aparte y no depende de este flujo.
#
# Secretos necesarios: HEROKU_API_KEY, HEROKU_APP_NAME, BACKUP_PASSPHRASE,
# R2_ENDPOINT_URL, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
# Ver docs/backups.md.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copia
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar boto3
        run: pip install --disable-pip-version-check "boto3==1.44.2"

      - name: Comprobar secretos
        run: |
          set -euo pipefail
          for nombre in HEROKU_API_KEY HEROKU_APP_NAME BACKUP_PASSPHRASE \
                        R2_ENDPOINT_URL R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!nombre:-}" ]; then
              echo "falta el secreto $nombre" >&2
              exit 1
            fi
          done

      # La cadena de la base no se guarda en GitHub: se pide a Heroku en tiempo de
      # ejecución, así que una rotación de credenciales no rompe la copia. Va por la
      # API de la plataforma, no por la CLI: el runner solo necesita Python.
      - name: Obtener DATABASE_URL de Heroku
        run: |
          set -euo pipefail
          URL="$(python scripts/heroku_config.py "$HEROKU_APP_NAME" database_url)"
          if [ -z "$URL" ]; then
            echo "Heroku no devolvió DATABASE_URL para $HEROKU_APP_NAME" >&2
            exit 1
          fi
          # El script ya añade sslmode=require; se enmascara para que no acabe en el log.
          echo "::add-mask::$URL"
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"

      # El cliente tiene que ser de versión mayor o igual que el servidor. Se lee la
      # versión del servidor y, si el cliente del runner se queda corto, se instala
      # el paquete que toca desde PGDG; si tampoco así, se falla con el motivo.
      - name: Ajustar la versión del cliente de Postgres
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          SERVIDOR="$(psql "$DATABASE_URL" -tAc 'show server_version' | cut -d. -f1 | tr -d ' ')"
          CLIENTE="$(pg_dump --version | sed -E 's/.* ([0-9]+).*/\1/')"
          echo "servidor PostgreSQL $SERVIDOR, pg_dump $CLIENTE"
          if [ "$CLIENTE" -lt "$SERVIDOR" ]; then
            echo "el cliente ($CLIENTE) es más viejo que el servidor ($SERVIDOR): instalo postgresql-client-$SERVIDOR" >&2
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq "postgresql-client-$SERVIDOR"
            CLIENTE="$(pg_dump --version | sed -E 's/.* ([0-9]+).*/\1/')"
          fi
          if [ "$CLIENTE" -lt "$SERVIDOR" ]; then
            echo "no se pudo igualar el cliente ($CLIENTE) al servidor ($SERVIDOR)" >&2
            exit 1
          fi
          echo "PG_MAJOR=$CLIENTE" >> "$GITHUB_ENV"

      - name: Volcar y cifrar
        run: |
          set -euo pipefail
          COPIAS="$(mktemp -d)"
          DUMP="$COPIAS/cosknot.dump"
          pg_dump --format=custom --no-owner --no-privileges -f "$DUMP" "$DATABASE_URL"
          TAMANO="$(stat -c%s "$DUMP")"
          echo "dump de $TAMANO bytes"
          if [ "$TAMANO" -lt 1024 ]; then
            echo "el dump ocupa $TAMANO bytes: conexión mala o base vacía" >&2
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$DUMP" -out "$DUMP.enc" -pass env:BACKUP_PASSPHRASE
          rm -f "$DUMP"
          echo "COPIAS=$COPIAS" >> "$GITHUB_ENV"

      - name: Subir a R2 y borrar las de más de 30 días
        run: |
          set -euo pipefail
          python scripts/copias.py subir "$COPIAS/cosknot.dump.enc"
          python scripts/copias.py purgar --dias 30
          rm -rf "$COPIAS"
