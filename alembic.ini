[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# La URL real la pone `migrations/env.py` desde DATABASE_URL, pasando por
# `normalize_database_url`. Aquí no se declara para no dejar credenciales en el
# repositorio.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
